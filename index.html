const teclas = {};

// zera tudo e começa uma partida nova
function recomecar() {
  caminhao = { x: 160, y: 440, l: 80, a: 50 };
  caixas = [];
  pontos = 0;
  vidas = 3;
  fim = false;
  tempo = 0;
}

// cria uma caixa em posição aleatória no topo
function novaCaixa() {
  caixas.push({ x: Math.random() * 360, y: -30, l: 30, v: 2 + pontos * 0.1 });
}

// atualiza posições e regras
function atualizar() {
  if (fim) return;

  // move o caminhão com as setas
  if (teclas.ArrowLeft)  caminhao.x -= 6;
  if (teclas.ArrowRight) caminhao.x += 6;
  caminhao.x = Math.max(0, Math.min(tela.width - caminhao.l, caminhao.x)); // não sai da tela

  // a cada 50 quadros cai uma caixa nova
  tempo++;
  if (tempo % 50 === 0) novaCaixa();

  for (let i = caixas.length - 1; i >= 0; i--) {
    const b = caixas[i];
    b.y += b.v; // a caixa cai

    // pegou? a caixa encostou na carroceria
    if (b.y + b.l > caminhao.y && b.x + b.l > caminhao.x && b.x < caminhao.x + caminhao.l) {
      pontos++;
      caixas.splice(i, 1);
    }
    // caiu no chão? perde uma vida
    else if (b.y > tela.height - 10) {
      vidas--;
      caixas.splice(i, 1);
      if (vidas <= 0) fim = true; // 3 caixas no chão = fim de jogo
    }
  }
}

// desenha tudo na tela
function desenhar() {
  c.clearRect(0, 0, tela.width, tela.height);
  c.drawImage(fundo, 0, 0, tela.width, tela.height); // fundo do armazém
  c.fillStyle = 'rgba(0,0,0,0.25)'; c.fillRect(0, 0, tela.width, tela.height); // escurece para dar contraste

  // chão
  c.fillStyle = '#555';
  c.fillRect(0, tela.height - 10, tela.width, 10);

  // caixas
  c.fillStyle = '#b9803f';
  caixas.forEach(b => { c.fillRect(b.x, b.y, b.l, b.l); c.strokeStyle = '#fff'; c.lineWidth = 2; c.strokeRect(b.x, b.y, b.l, b.l); });

  // caminhão: carroceria, cabine e rodas
  c.fillStyle = '#d33';  c.fillRect(caminhao.x, caminhao.y, 55, 35);
  c.fillStyle = '#36c';  c.fillRect(caminhao.x + 55, caminhao.y + 10, 25, 25);
  c.fillStyle = '#000';
  c.beginPath(); c.arc(caminhao.x + 15, caminhao.y + 38, 9, 0, 7); c.fill();
  c.beginPath(); c.arc(caminhao.x + 65, caminhao.y + 38, 9, 0, 7); c.fill();

  // pontos e vidas
  c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0, 0, tela.width, 40);
  c.fillStyle = '#fff';
  c.font = 'bold 20px sans-serif';
  c.textAlign = 'left';
  c.fillText('Pontos: ' + pontos, 10, 28);
  c.fillText('Vidas: ' + vidas, 300, 28);

  // mensagem de fim de jogo
  if (fim) {
    c.textAlign = 'center';
    c.font = 'bold 36px sans-serif';
    c.fillStyle = '#fff'; c.fillText('FIM DE JOGO', 200, 240);
  }
}

// repete a cada quadro (cerca de 60 vezes por segundo)
function loop() {
  atualizar();
  desenhar();
  requestAnimationFrame(loop);
}

// teclado
addEventListener('keydown', e => { teclas[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup',   e => { teclas[e.key] = false; });

// toque no celular: o caminhão segue o dedo
tela.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' || e.buttons) {
    const r = tela.getBoundingClientRect();
    caminhao.x = (e.clientX - r.left) * tela.width / r.width - caminhao.l / 2;
  }
});

document.getElementById('recomecar').onclick = recomecar;

recomecar();
loop();
</script>
