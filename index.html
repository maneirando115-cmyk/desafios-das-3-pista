<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Aventura na Caverna</title>
<style>
html,body{margin:0;height:100%;background:#0b0710;color:#fff;font-family:Georgia,serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
#box{position:relative;line-height:0;box-shadow:0 0 40px #000}
canvas{width:100%;height:auto;display:block;background:#000}
#tela{position:absolute;inset:0;background:rgba(10,5,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.4;padding:1em}
#tela h1{font-size:2.6em;margin:0 0 .3em;color:#ffcf4a;text-shadow:0 0 18px #ff8a1c,0 3px 0 #7a3b00}
#tela p{max-width:34em;margin:.3em 0 1em;font-size:1.05em}
#tela small{opacity:.75;margin-top:1em;font-size:.85em}
button{font-family:inherit;cursor:pointer}
#bt{font-size:1.5em;padding:.4em 1.6em;border:0;border-radius:.5em;background:linear-gradient(#ffb12a,#e0600a);color:#fff;font-weight:bold;box-shadow:0 4px 0 #8a3200}
#bt:active{transform:translateY(3px);box-shadow:none}
#som{position:absolute;left:8px;top:40px;background:rgba(0,0,0,.5);border:1px solid #fff5;color:#fff;border-radius:8px;font-size:16px;padding:2px 8px}
#ctl{display:none;position:absolute;left:0;right:0;bottom:0;justify-content:space-between;align-items:flex-end;box-sizing:border-box;padding:10px 14px;pointer-events:none;line-height:1}
#ctl div{display:flex;align-items:flex-end;gap:10px}
#ctl button{pointer-events:auto;width:72px;height:64px;font-size:30px;border-radius:16px;border:2px solid #fff6;background:#ffffff26;color:#fff;margin:0;-webkit-tap-highlight-color:transparent}
#ctl button[data-k=j]{width:92px;height:84px;font-size:42px;border-radius:50%}
#ctl button[data-k=r]{width:56px;height:56px;font-size:24px;border-radius:50%}
#ctl button.on{background:#ff9d2e99}
@media (hover:none){#ctl{display:flex}}
</style>
</head>
<body>
<div id="wrap">
  <div id="box">
    <canvas id="c"></canvas>
    <button id="som" title="Som (M)">🔊</button>
    <div id="ctl">
      <div><button data-k="j">⬆</button></div>
      <div><button data-k="r" title="Correr">🏃</button><button data-k="l">◀</button><button data-k="d">▶</button></div>
    </div>
    <div id="tela">
      <h1 id="ti">Aventura na Caverna</h1>
      <p id="tx">Ajude o homem das cavernas a coletar minérios, escapar da lava, dos espinhos e das pedras que caem, e abrir a porta de cada uma das 4 cavernas!</p>
      <button id="bt">Jogar</button>
      <small>← → ou A D: andar • Shift: correr • Espaço / ↑ / W: pular • M: som</small>
    </div>
  </div>
</div>

<script>
// ================== CONFIGURAÇÃO ==================
const T=32,VW=800,VH=450;                       // tamanho do bloco e da tela
const cv=document.getElementById('c'),g=cv.getContext('2d');cv.width=VW;cv.height=VH;
const luz=document.createElement('canvas');luz.width=VW;luz.height=VH;const lg=luz.getContext('2d'); // camada de escuridão

// cores de cada fase: [fundo topo, fundo base, pedra, pedra clara]
const PAL=[['#1d1410','#3a2519','#5a4638','#7d6554'],['#12142b','#2a1d4a','#3e3d6b','#6461a0'],
           ['#0f1f24','#1f3a3f','#3d5558','#68898b'],['#240b0b','#4a1410','#5b3030','#8a4a44']];
const CRI=['#5ee0ff','#c27bff','#5effc7','#ff9a5e'];   // cor dos cristais decorativos
// largura, maior buraco, maior lava, máximo de pedras, minérios necessários
const NIV=[{n:'Gruta Rasa',w:64,gap:2,pool:3,ped:2,need:5},{n:'Túneis de Cristal',w:80,gap:3,pool:3,ped:4,need:8},
           {n:'Mina Profunda',w:96,gap:3,pool:4,ped:7,need:11},{n:'Coração de Lava',w:112,gap:3,pool:4,ped:11,need:14}];

const H=(a,b)=>{let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0}; // número "aleatório" fixo

// ================== SOM ==================
let AC,mudo=false,mus=null,passo=0;
function som(f,d,tipo='square',v=.08,f2){            // toca um beep
  if(!AC||mudo)return;const t=AC.currentTime,o=AC.createOscillator(),a=AC.createGain();
  o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  a.gain.setValueAtTime(v,t);a.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(a);a.connect(AC.destination);o.start();o.stop(t+d)}
const sfx={pulo:()=>som(260,.18,'square',.06,640),morre:()=>som(320,.7,'sawtooth',.1,40),pedra:()=>som(130,.3,'sawtooth',.09,45),
  ore:()=>{som(880,.1,'triangle',.1);setTimeout(()=>som(1320,.2,'triangle',.1),70)},
  porta:()=>[400,500,600,800].forEach((f,i)=>setTimeout(()=>som(f,.2,'square',.07),i*90)),
  vence:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>setTimeout(()=>som(f,.3,'triangle',.12),i*140)),
  falta:()=>som(160,.2,'square',.07)};
const mel=[220,0,262,330,294,0,262,220,196,0,247,294,262,0,220,0];     // melodia de aventura (loop)
const bx=[110,0,110,0,98,0,98,0,87,0,87,0,98,0,98,0];
function musica(){if(mus)return;mus=setInterval(()=>{if(!AC||mudo)return;const i=passo++%16;
  if(mel[i])som(mel[i],.22,'triangle',.05);if(bx[i])som(bx[i],.4,'sine',.1);if(i%4==2)som(70,.12,'sine',.12,35);},220)}
document.getElementById('som').onclick=()=>{mudo=!mudo;document.getElementById('som').textContent=mudo?'🔇':'🔊'};

// ================== GERADOR DE FASES ==================
function gerar(k){
  const L=NIV[k],W=L.w,R=Array.from({length:14},()=>Array(W).fill('.'));
  let s=k*977+13;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  for(let x=0;x<W;x++){R[0][x]=R[1][x]=R[12][x]=R[13][x]='#'}      // teto e chão
  for(let y=0;y<14;y++)R[y][0]=R[y][W-1]='#';                         // paredes
  let ores=0;const rocks=[],tochas=[],deco=[];
  const ore=(c,r)=>{R[r][c]=rnd()<.12+k*.06?'d':rnd()<.5?'g':'c';ores++};   // d=diamante g=ouro c=cristal
  const sp=()=>ri(6-k,8-k);let x=8;
  while(x<W-10){                                                       // coloca obstáculos ao longo da caverna
    const r=rnd();
    if(r<.18){const w=ri(2,L.gap);for(let i=0;i<w;i++)R[12][x+i]=R[13][x+i]='.';ore(x+(w>>1),9);x+=w+sp()}          // buraco
    else if(r<.36){const w=ri(2,L.pool);for(let i=0;i<w;i++)R[12][x+i]='L';ore(x+(w>>1),9);x+=w+sp()}              // lava
    else if(r<.52){const w=ri(1,2+(k>1?1:0));for(let i=0;i<w;i++)R[11][x+i]='^';if(rnd()<.6)ore(x,9);x+=w+sp()}    // espinhos
    else if(r<.72){const w=ri(3,4);for(let i=0;i<w;i++)R[9][x+i]='#';ore(x+1,8);if(rnd()<.5)ore(x+2,8);x+=w+ri(2,4)} // plataforma
    else if(rocks.length<L.ped){rocks.push(x);x+=ri(4,6)}                                                          // pedra que cai
    else{R[11][x]='^';x+=sp()}
  }
  for(let g2=0;ores<L.need+3&&g2<500;g2++){const c=ri(6,W-10);if(R[11][c]=='.'&&R[12][c]=='#')ore(c,11)}          // garante minérios
  for(let c=10;c<W-10;c+=ri(5,9)){if(R[11][c]=='.'&&R[12][c]=='#'&&rnd()<.6)ore(c,11)}                            // minérios no chão
  for(let c=5;c<W-3;c+=ri(7,10))tochas.push({x:c*T+16,y:ri(4,6)*T});                                              // tochas
  for(let i=0;i<W/5;i++){const c=ri(2,W-3);if(R[11][c]=='.'&&R[12][c]=='#')deco.push({c,t:i%3})}                  // cristais de enfeite
  return{R,W,rocks,tochas,deco,need:L.need}
}

// ================== ESTADO DO JOGO ==================
let est='menu',niv=0,vidas=3,pts=0,ptsIni=0,minerios=0,need=0,W=0,mapa,P,pedras=[],parts=[],tochas=[],deco=[];
let cam=0,camx=0,shake=0,tempo=0,aviso=0,msg='',msgT=0,jAnt=false;
function carregar(k){                                                  // monta uma fase
  niv=k;const m=gerar(k);mapa=m.R;W=m.W;need=m.need;tochas=m.tochas;deco=m.deco;
  pedras=m.rocks.map(c=>({x:c*T+4,y:2*T,vy:0,e:0,t:0}));               // e: 0 parada,1 tremendo,2 caindo,3 quebrada
  P={x:2*T,y:10*T,vx:0,vy:0,w:22,h:40,solo:false,dir:1,anim:0,coy:0,buf:0};
  minerios=0;pts=ptsIni;parts=[];cam=0;aviso=170;msgT=0}
const sol=(c,r)=>r<0||c<0||c>=W?true:r>=14?false:mapa[r][c]=='#';
function bate(o){const c0=Math.floor(o.x/T),c1=Math.floor((o.x+o.w-.01)/T),r0=Math.floor(o.y/T),r1=Math.floor((o.y+o.h-.01)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(sol(c,r))return true;return false}
const choca=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function burst(x,y,col,n=10){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,l:30+Math.random()*20,c:col,s:2+Math.random()*3})}

// ================== TECLADO E TOQUE ==================
const K={},TC={};
addEventListener('keydown',e=>{K[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.code=='KeyM')document.getElementById('som').click();
  if((e.code=='Enter'||e.code=='Space')&&tela.style.display!='none')bt.click()});
addEventListener('keyup',e=>K[e.code]=0);
document.querySelectorAll('#ctl button').forEach(b=>{const k=b.dataset.k;
  if(k=='r'){b.onpointerdown=e=>{e.preventDefault();TC.r=!TC.r;b.classList.toggle('on',TC.r)};return}   // correr liga/desliga
  b.onpointerdown=e=>{e.preventDefault();TC[k]=1;b.classList.add('on')};
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b['on'+ev]=()=>{TC[k]=0;b.classList.remove('on')})});
document.addEventListener('contextmenu',e=>e.preventDefault());
const esq=()=>K.ArrowLeft||K.KeyA||TC.l,dirk=()=>K.ArrowRight||K.KeyD||TC.d,pulo=()=>K.Space||K.ArrowUp||K.KeyW||TC.j,corre=()=>K.ShiftLeft||K.ShiftRight||TC.r;

// ================== TELAS ==================
const tela=document.getElementById('tela'),bt=document.getElementById('bt');
function mostrar(t,x,b){document.getElementById('ti').textContent=t;document.getElementById('tx').textContent=x;bt.textContent=b;tela.style.display='flex'}
bt.onclick=()=>{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume();musica();   // começa o jogo
  vidas=3;pts=0;ptsIni=0;carregar(0);est='jogo';tela.style.display='none'};
function morrer(){if(est!='jogo')return;est='morte';vidas--;sfx.morre();shake=16;
  burst(P.x+11,P.y+20,'#e0a070',18);burst(P.x+11,P.y+20,'#ff4a2a',10);
  setTimeout(()=>{if(vidas<=0){est='fim';mostrar('Fim de jogo','Você fez '+pts+' pontos. A caverna venceu desta vez!','Recomeçar')}
    else{carregar(niv);est='jogo'}},950)}
function passar(){est='troca';sfx.porta();pts+=50+vidas*25;vidas=Math.min(3,vidas+1);
  setTimeout(()=>{if(niv+1>=NIV.length){est='fim';sfx.vence();mostrar('🏆 Vitória!','Você explorou as 4 cavernas e escapou com '+pts+' pontos! Você é o rei da caverna!','Jogar de novo')}
    else{ptsIni=pts;carregar(niv+1);est='jogo'}},900)}

// ================== ATUALIZAÇÃO (a cada quadro) ==================
function atualizar(){
  tempo++;if(aviso>0)aviso--;if(msgT>0)msgT--;if(shake>0)shake--;
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vy+=.2;q.l--}parts=parts.filter(q=>q.l>0);
  if(est=='morte'||est=='troca'||est=='jogo'){for(const p of pedras)pedraUpd(p)}
  if(est!='jogo')return;
  const p=P,ax=(dirk()?1:0)-(esq()?1:0);
  // andar / correr
  p.vx+=(ax*(corre()?4.6:2.7)-p.vx)*(p.solo?.3:.14);if(!ax&&Math.abs(p.vx)<.1)p.vx=0;if(ax)p.dir=ax;
  // pulo (com folga de tempo para ficar mais fácil)
  const j=pulo();if(j&&!jAnt)p.buf=8;jAnt=j;p.buf--;p.coy=p.solo?7:p.coy-1;
  if(p.buf>0&&p.coy>0){p.vy=-11.3;p.buf=0;p.coy=0;p.solo=false;sfx.pulo();burst(p.x+11,p.y+40,'#aa9',4)}
  if(!j&&p.vy<-4)p.vy=-4;                                   // soltar o botão = pulo curto
  p.vy=Math.min(p.vy+.55,13);                               // gravidade
  p.x+=p.vx;if(bate(p)){const s=Math.sign(p.vx)||1;while(bate(p))p.x-=s*.5;p.vx=0}   // colisão horizontal
  p.solo=false;p.y+=p.vy;if(bate(p)){const s=Math.sign(p.vy)||1;while(bate(p))p.y-=s*.5;if(p.vy>0)p.solo=true;p.vy=0} // colisão vertical
  p.anim+=Math.abs(p.vx)*.09;
  if(p.y>VH+60)return morrer();
  // tocar em lava, espinhos e minérios
  const c0=Math.floor(p.x/T),c1=Math.floor((p.x+p.w)/T),r0=Math.floor(p.y/T),r1=Math.floor((p.y+p.h)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const ch=mapa[r]&&mapa[r][c];if(!ch)continue;
    if(ch=='L'&&p.y+p.h>r*T+10)return morrer();
    if(ch=='^'&&p.y+p.h>r*T+16&&p.x+p.w-4>c*T+3&&p.x+4<c*T+T-3)return morrer();
    if(ch=='g'||ch=='d'||ch=='c'){if(choca({x:p.x,y:p.y,w:p.w,h:p.h},{x:c*T+6,y:r*T+6,w:T-12,h:T-12})){
      mapa[r][c]='.';minerios++;pts+=ch=='d'?30:ch=='c'?15:10;sfx.ore();
      burst(c*T+16,r*T+16,ch=='d'?'#6ee7ff':ch=='c'?'#e07bff':'#ffd23f',12)}}}
  // pedras que caem acertam o jogador?
  for(const q of pedras)if(q.e==2&&choca({x:p.x+3,y:p.y+3,w:p.w-6,h:p.h-3},{x:q.x,y:q.y,w:24,h:26}))return morrer();
  // porta de saída
  if(choca(p,{x:(W-4)*T-4,y:10*T,w:44,h:2*T})){
    if(minerios>=need)passar();else if(msgT<20){msg='Faltam '+(need-minerios)+' minérios para abrir a porta!';msgT=90;sfx.falta()}}
  cam+=((p.x-VW/2+60*p.dir)-cam)*.1;cam=Math.max(0,Math.min(W*T-VW,cam));camx=Math.floor(cam);
}
function pedraUpd(q){
  if(q.e==0&&P&&Math.abs(P.x-q.x)<150&&est=='jogo'){q.e=1;q.t=60-niv*10}
  else if(q.e==1){q.t--;if(q.t%6==0)parts.push({x:q.x+12,y:q.y+26,vx:0,vy:1,l:20,c:'#bbb',s:2});if(q.t<=0)q.e=2}
  else if(q.e==2){q.vy=Math.min(q.vy+.5,11);q.y+=q.vy;
    if(sol(Math.floor((q.x+12)/T),Math.floor((q.y+26)/T))||q.y>VH){q.e=3;sfx.pedra();shake=8;burst(q.x+12,q.y+24,'#9a8f88',12)}}
}

// ================== DESENHO ==================
function fundo(){const pal=PAL[niv];                                    // montanhas ao fundo (parallax)
  for(let L=0;L<2;L++){const f=.2+L*.2,sp=120-L*30,w0=Math.floor(cam*f/sp);g.fillStyle=pal[2]+(L?'88':'55');
    for(let i=-1;i<=Math.ceil(VW/sp)+1;i++){const wi=w0+i,x=wi*sp-cam*f,hh=70+H(wi,L+9)%90-L*20;g.beginPath();
      if(L==0){g.moveTo(x,VH);g.lineTo(x+sp/2,VH-hh);g.lineTo(x+sp,VH)}else{g.moveTo(x,0);g.lineTo(x+sp/2,hh);g.lineTo(x+sp,0)}g.fill()}}}
function pedra(c,r,x,y){const h=H(c,r),pal=PAL[niv];g.fillStyle=pal[2];g.fillRect(x,y,T,T);
  g.fillStyle=`rgba(0,0,0,${(h%18)/100})`;g.fillRect(x,y,T,T);g.fillStyle=pal[3]+'55';
  for(let i=0;i<3;i++){const q=H(c+i,r*3+i);g.fillRect(x+q%26,y+(q>>5)%26,3+q%3,2+q%3)}
  if(r>0&&mapa[r-1][c]!='#'){g.fillStyle=pal[3];g.fillRect(x,y,T,4);g.fillStyle='rgba(255,255,255,.12)';g.fillRect(x,y+4,T,2)}
  g.strokeStyle='rgba(0,0,0,.28)';g.strokeRect(x+.5,y+.5,T-1,T-1)}
function tri(a,b,c,d,e,f,col){g.fillStyle=col;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.lineTo(e,f);g.closePath();g.fill()}
function lava(c,x,y){g.fillStyle='#e8400c';g.beginPath();g.moveTo(x,y+T);
  for(let i=0;i<=T;i+=4)g.lineTo(x+i,y+4+Math.sin((c*T+i)/9+tempo/12)*2.5);g.lineTo(x+T,y+T);g.fill();
  g.strokeStyle='#ffd24a';g.lineWidth=2;g.beginPath();for(let i=0;i<=T;i+=4)g.lineTo(x+i,y+4+Math.sin((c*T+i)/9+tempo/12)*2.5);g.stroke();
  g.fillStyle='#ffb21a';const b=(tempo+c*13)%50;g.beginPath();g.arc(x+8+(c*7)%16,y+T-b*.5,2,0,7);g.fill()}
function espinhos(x,y){for(let i=0;i<3;i++){tri(x+i*10+1,y+T,x+i*10+6,y+12,x+i*10+11,y+T,'#c3cad2');tri(x+i*10+6,y+12,x+i*10+11,y+T,x+i*10+6,y+T,'#7d8590')}}
function minerio(ch,x,y,c){const cx=x+16,cy=y+18+Math.sin(tempo/14+c)*2;
  g.globalCompositeOperation='lighter';const q=g.createRadialGradient(cx,cy,2,cx,cy,22);
  q.addColorStop(0,ch=='d'?'rgba(110,231,255,.5)':ch=='c'?'rgba(224,123,255,.5)':'rgba(255,210,60,.5)');q.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=q;g.fillRect(cx-22,cy-22,44,44);g.globalCompositeOperation='source-over';
  if(ch=='g'){g.fillStyle='#b8860b';g.beginPath();g.moveTo(cx-9,cy+7);g.lineTo(cx-10,cy-1);g.lineTo(cx-3,cy-8);g.lineTo(cx+7,cy-6);g.lineTo(cx+10,cy+3);g.lineTo(cx+5,cy+8);g.fill();
    g.fillStyle='#ffd23f';g.beginPath();g.moveTo(cx-7,cy+4);g.lineTo(cx-7,cy-1);g.lineTo(cx-2,cy-6);g.lineTo(cx+6,cy-4);g.lineTo(cx+3,cy+3);g.fill();g.fillStyle='#fff6b0';g.fillRect(cx-3,cy-4,3,3)}
  else if(ch=='d'){g.fillStyle='#3fb6d6';g.beginPath();g.moveTo(cx,cy-11);g.lineTo(cx+11,cy-3);g.lineTo(cx,cy+11);g.lineTo(cx-11,cy-3);g.fill();
    g.fillStyle='#9af0ff';g.beginPath();g.moveTo(cx,cy-11);g.lineTo(cx+11,cy-3);g.lineTo(cx-11,cy-3);g.fill();
    g.strokeStyle='#fff';g.lineWidth=1;g.beginPath();g.moveTo(cx-4,cy-3);g.lineTo(cx,cy+10);g.lineTo(cx+4,cy-3);g.stroke();g.fillStyle='#fff';g.fillRect(cx-6,cy-7,2,2)}
  else{cristal(cx,y+T-4,'#e07bff','#a03ad0',1)}}
function cristal(cx,by,c1,c2,s){[[-7,14,6],[0,22,7],[7,12,6]].forEach(([dx,h,w])=>{h*=s;w*=s;tri(cx+dx-w/2,by,cx+dx,by-h,cx+dx+w/2,by,c1);tri(cx+dx,by-h,cx+dx+w/2,by,cx+dx,by,c2)})}
function tocha(t){const x=t.x-camx,y=t.y,f=Math.sin(tempo/4+t.x)*2;
  g.fillStyle='#4a2f18';g.fillRect(x-3,y,6,26);g.fillStyle='#777';g.fillRect(x-6,y-1,12,4);
  g.fillStyle='#ff6a00';g.beginPath();g.ellipse(x,y-8,7+f*.4,12+f,0,0,7);g.fill();
  g.fillStyle='#ffd23a';g.beginPath();g.ellipse(x,y-6,4,8+f*.5,0,0,7);g.fill()}
function pedraCai(q){const x=q.x-camx;let ox=q.e==1?(Math.random()-.5)*3:0;if(q.e==3)return;
  if(q.e<2)tri(x+4+ox,q.y-4,x+20+ox,q.y-4,x+12+ox,q.y+8,PAL[niv][2]);                 // ponta ligada ao teto
  g.fillStyle='#8d8580';g.beginPath();g.moveTo(x+ox,q.y+10);g.lineTo(x+6+ox,q.y);g.lineTo(x+18+ox,q.y+2);g.lineTo(x+25+ox,q.y+12);g.lineTo(x+18+ox,q.y+26);g.lineTo(x+5+ox,q.y+24);g.fill();
  g.fillStyle='#6a625e';g.beginPath();g.moveTo(x+25+ox,q.y+12);g.lineTo(x+18+ox,q.y+26);g.lineTo(x+12+ox,q.y+24);g.lineTo(x+16+ox,q.y+10);g.fill();
  g.strokeStyle='#3d3835';g.lineWidth=1;g.beginPath();g.moveTo(x+9+ox,q.y+6);g.lineTo(x+13+ox,q.y+14);g.lineTo(x+10+ox,q.y+20);g.stroke()}
function porta(){const x=(W-4)*T-camx-2,y=10*T,ab=minerios>=need;
  g.fillStyle='#2a2320';g.fillRect(x-6,y-8,56,72);g.fillStyle='#4a403b';g.fillRect(x-3,y-5,50,69);
  g.fillStyle=ab?'#ffe27a':'#1a0f0a';g.beginPath();g.moveTo(x+2,y+64);g.lineTo(x+2,y+14);g.arc(x+22,y+14,20,Math.PI,0);g.lineTo(x+42,y+64);g.fill();
  if(ab){g.globalCompositeOperation='lighter';g.fillStyle='rgba(255,220,100,.25)';for(let i=0;i<4;i++){g.beginPath();g.moveTo(x+22,y+30);g.lineTo(x+22+Math.cos(tempo/30+i*1.6)*60,y+30+Math.sin(tempo/30+i*1.6)*60);g.lineTo(x+22+Math.cos(tempo/30+i*1.6+.3)*60,y+30+Math.sin(tempo/30+i*1.6+.3)*60);g.fill()}g.globalCompositeOperation='source-over'}
  else{g.fillStyle='#7a2a1a';g.fillRect(x+8,y+14,28,34);g.fillStyle='#c0392b';g.fillRect(x+10,y+16,24,30);g.fillStyle='#ffd23f';g.beginPath();g.arc(x+22,y+28,5,0,7);g.fill();g.fillRect(x+20,y+30,4,10)}
  txt(minerios+'/'+need,x+22,y-14,16,'center',ab?'#ffe27a':'#ff9a8a')}
function homem(){const p=P,ar=!p.solo,sw=Math.sin(p.anim),mv=Math.abs(p.vx)>.3;
  g.save();g.translate(Math.round(p.x+p.w/2-camx),Math.round(p.y+p.h));g.scale(p.dir,1);g.lineCap='round';g.lineJoin='round';
  const l1=ar?-5:mv?sw*9:0,l2=ar?7:mv?-sw*9:0;
  g.strokeStyle='#c98a5a';g.lineWidth=6;g.beginPath();g.moveTo(-3,-14);g.lineTo(-3+l1,-3);g.stroke();g.beginPath();g.moveTo(3,-14);g.lineTo(3+l2,-3);g.stroke();   // pernas
  g.fillStyle='#6b4423';g.fillRect(-3+l1-3,-5,9,5);g.fillRect(3+l2-3,-5,9,5);                                                                                      // pés
  g.strokeStyle='#c98a5a';g.lineWidth=5;g.beginPath();g.moveTo(-4,-27);g.lineTo(-4+(mv?-sw*8:-2),-16);g.stroke();                                                // braço de trás
  g.fillStyle='#d98c2b';g.beginPath();g.moveTo(-9,-30);g.lineTo(9,-30);g.lineTo(10,-12);g.lineTo(6,-9);g.lineTo(2,-12);g.lineTo(-2,-9);g.lineTo(-6,-12);g.lineTo(-10,-10);g.fill();   // pele de leopardo
  g.fillStyle='#5a3310';[[-4,-25],[3,-21],[-2,-16],[5,-27]].forEach(([a,b])=>{g.beginPath();g.arc(a,b,1.8,0,7);g.fill()});g.fillRect(-9,-19,19,3);
  const ax=4+(mv?sw*8:3),ay=-17+(ar?-8:0);                                                                                                                         // braço da frente e clava
  g.strokeStyle='#e0a070';g.lineWidth=5;g.beginPath();g.moveTo(4,-27);g.lineTo(ax,ay);g.stroke();
  g.strokeStyle='#7a4a1e';g.lineWidth=4;g.beginPath();g.moveTo(ax,ay);g.lineTo(ax+9,ay-14);g.stroke();g.lineWidth=8;g.beginPath();g.moveTo(ax+8,ay-13);g.lineTo(ax+10,ay-19);g.stroke();
  g.fillStyle='#e0a070';g.beginPath();g.arc(2,-34,8,0,7);g.fill();                                                                                                // cabeça
  g.fillStyle='#3b2412';g.beginPath();g.arc(0,-36,9,Math.PI*.8,Math.PI*2.05);g.lineTo(3,-38);g.closePath();g.fill();g.beginPath();g.arc(3,-30,6,.15,Math.PI-.4);g.fill();  // cabelo e barba
  g.fillStyle='#fff';g.fillRect(5,-36,3,3);g.fillStyle='#000';g.fillRect(7,-35,2,2);
  g.strokeStyle='#f4efe0';g.lineWidth=2;g.beginPath();g.moveTo(-6,-41);g.lineTo(-1,-44);g.stroke();                                                                  // osso no cabelo
  g.restore()}
function txt(s,x,y,sz,al,col){g.font=`bold ${sz}px Georgia,serif`;g.textAlign=al;g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.8)';g.strokeText(s,x,y);g.fillStyle=col;g.fillText(s,x,y)}

function desenhar(){
  const pal=PAL[niv];g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  const gr=g.createLinearGradient(0,0,0,VH);gr.addColorStop(0,pal[0]);gr.addColorStop(1,pal[1]);g.fillStyle=gr;g.fillRect(-20,-20,VW+40,VH+40);
  fundo();
  const c0=Math.max(0,Math.floor(camx/T)),c1=Math.min(W-1,c0+Math.ceil(VW/T)+1),lights=[];
  for(const t of tochas)tocha(t);
  for(const d of deco)if(d.c>=c0-1&&d.c<=c1+1){cristal(d.c*T-camx+16,12*T,CRI[niv],'#0006',.7+d.t*.2);lights.push([d.c*T-camx+16,11*T,60,.6])}
  for(let r=0;r<14;r++)for(let c=c0;c<=c1;c++){const ch=mapa[r][c],x=c*T-camx,y=r*T;
    if(ch=='#')pedra(c,r,x,y);
    else if(ch=='L'){lava(c,x,y);lights.push([x+16,y+8,95,.75])}
    else if(ch=='^')espinhos(x,y);
    else if(ch=='g'||ch=='d'||ch=='c'){minerio(ch,x,y,c);lights.push([x+16,y+16,46,.55])}
    else if(r==2&&H(c,7)%3==0)tri(x+6,y,x+26,y,x+16,y+14+H(c,8)%24,pal[2])}               // estalactites
  porta();for(const q of pedras)pedraCai(q);
  if(est!='morte')homem();
  for(const q of parts){g.globalAlpha=Math.min(1,q.l/25);g.fillStyle=q.c;g.fillRect(q.x-camx,q.y,q.s,q.s)}g.globalAlpha=1;
  // brilho quente das tochas
  g.globalCompositeOperation='lighter';
  for(const t of tochas){const x=t.x-camx;if(x<-200||x>VW+200)continue;const f=Math.sin(tempo/5+t.x)*8,q=g.createRadialGradient(x,t.y-8,4,x,t.y-8,150+f);
    q.addColorStop(0,'rgba(255,150,50,.3)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(x-200,t.y-200,400,400);lights.push([x,t.y-8,175+f,.95])}
  g.globalCompositeOperation='source-over';
  // iluminação: escuridão com buracos de luz
  lg.globalCompositeOperation='source-over';lg.clearRect(0,0,VW,VH);lg.fillStyle='rgba(6,3,12,.84)';lg.fillRect(0,0,VW,VH);lg.globalCompositeOperation='destination-out';
  const L=(x,y,r,a)=>{const q=lg.createRadialGradient(x,y,r*.1,x,y,r);q.addColorStop(0,`rgba(0,0,0,${a})`);q.addColorStop(1,'rgba(0,0,0,0)');lg.fillStyle=q;lg.beginPath();lg.arc(x,y,r,0,7);lg.fill()};
  L(P.x+11-camx,P.y+18,155,1);L((W-4)*T-camx+22,11*T,minerios>=need?130:70,.9);for(const l of lights)L(...l);
  g.drawImage(luz,0,0);
  // ===== painel (HUD) =====
  g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,0,VW,34);
  txt('♥'.repeat(Math.max(0,vidas)),10,26,24,'left','#ff4d5a');
  txt('Fase '+(niv+1)+' – '+NIV[niv].n,VW/2,24,18,'center','#ffe9b0');
  txt('💎 '+minerios+'/'+need,VW-150,24,18,'right','#9af0ff');txt('★ '+pts,VW-12,24,18,'right','#ffd23f');
  if(aviso>0){g.globalAlpha=Math.min(1,aviso/40);txt('FASE '+(niv+1),VW/2,170,44,'center','#ffcf4a');txt(NIV[niv].n,VW/2,205,26,'center','#fff');
    txt('Colete '+need+' minérios e chegue à porta!',VW/2,240,18,'center','#9af0ff');g.globalAlpha=1}
  if(msgT>0)txt(msg,VW/2,110,20,'center','#ff9a8a');
  g.restore()}

// ================== LOOP PRINCIPAL ==================
let ult=0,acc=0;
function loop(t){acc+=Math.min(t-ult,100);ult=t;while(acc>=16.67){atualizar();acc-=16.67}desenhar();requestAnimationFrame(loop)}
function ajustar(){const s=Math.min(innerWidth/VW,innerHeight/VH);
  const b=document.getElementById('box');b.style.width=Math.floor(VW*s)+'px';b.style.fontSize=Math.max(9,18*s)+'px'}
addEventListener('resize',ajustar);ajustar();
carregar(0);requestAnimationFrame(loop);   // mostra a caverna ao fundo da tela inicial
</script>
